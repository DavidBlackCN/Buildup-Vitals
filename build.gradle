plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_name
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "buildup_vitals" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "maven.modrinth:thirst-was-taken-2:${project.thirst_version}"
    compileOnly "maven.modrinth:farmers-delight-refabricated:${project.farmers_delight_version}"
    compileOnly "maven.modrinth:kaleidoscope-cookery-refabricated:${project.kaleidoscope_cookery_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'buildup_vitals_test'
        enableGameTests = true
        enableClientGameTests = true
        // Local EULA acceptance is supplied by -PacceptMinecraftEula=true.
        eula = providers.gradleProperty('acceptMinecraftEula').map { it.toBoolean() }.getOrElse(false)
    }
}

dependencies {
    gametestCompileOnly "maven.modrinth:thirst-was-taken-2:${project.thirst_version}"
    gametestCompileOnly "maven.modrinth:kaleidoscope-cookery-refabricated:${project.kaleidoscope_cookery_version}"
    if (providers.gradleProperty('withCookery').map { it.toBoolean() }.getOrElse(false)) {
        localRuntime "maven.modrinth:kaleidoscope-cookery-refabricated:${project.kaleidoscope_cookery_version}"
        gametestRuntimeOnly "maven.modrinth:kaleidoscope-cookery-refabricated:${project.kaleidoscope_cookery_version}"
    }
    gametestCompileOnly "maven.modrinth:farmers-delight-refabricated:${project.farmers_delight_version}"
    if (providers.gradleProperty('withFarmersDelight').map { it.toBoolean() }.getOrElse(false)
            || providers.gradleProperty('withMoreDelight').map { it.toBoolean() }.getOrElse(false)) {
        localRuntime "maven.modrinth:farmers-delight-refabricated:${project.farmers_delight_version}"
        gametestRuntimeOnly "maven.modrinth:farmers-delight-refabricated:${project.farmers_delight_version}"
    }
    if (providers.gradleProperty('withMoreDelight').map { it.toBoolean() }.getOrElse(false)) {
        localRuntime "maven.modrinth:more-delight:${project.more_delight_version}"
        localRuntime "maven.modrinth:delight-lib:${project.delight_lib_version}"
        gametestRuntimeOnly "maven.modrinth:more-delight:${project.more_delight_version}"
        gametestRuntimeOnly "maven.modrinth:delight-lib:${project.delight_lib_version}"
    }
    if (providers.gradleProperty('withThirst').map { it.toBoolean() }.getOrElse(false)) {
        localRuntime "maven.modrinth:thirst-was-taken-2:${project.thirst_version}"
        gametestRuntimeOnly "maven.modrinth:thirst-was-taken-2:${project.thirst_version}"
    }
}

// Optional local compatibility fixture. Never a production dependency or bundled mod.
if (providers.gradleProperty('testAppleSkinJar').isPresent()) {
    dependencies {
        gametestRuntimeOnly files(providers.gradleProperty('testAppleSkinJar').get())
    }
}

// Local startup-regression fixtures (e.g. Iris/Sodium); never production dependencies.
if (providers.gradleProperty('testClientModsDir').isPresent()) {
    dependencies {
        gametestRuntimeOnly fileTree(dir: providers.gradleProperty('testClientModsDir').get(), include: ['*.jar'])
    }
}

processResources {
    def modVersion = project.version
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def archiveName = project.base.archivesName.get()
    inputs.property "archiveName", archiveName
    from("LICENSE") {
        rename { "${it}_${archiveName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_name
            from components.java
        }
    }
}
