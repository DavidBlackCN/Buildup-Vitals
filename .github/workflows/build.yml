name: Build

on:
  push:
    branches: ["*"]
    paths:
      - "src/**"
      - "gradle/**"
      - "*.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build.yml"
      - ".gitattributes"
  pull_request:
    branches: ["*"]
    paths:
      - "src/**"
      - "gradle/**"
      - "*.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build.yml"
      - ".gitattributes"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build -PacceptMinecraftEula=true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Buildup-Vitals-Artifacts
          path: build/libs/
